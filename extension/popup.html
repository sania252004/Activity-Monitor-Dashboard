<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
      background: #111827;
      color: #f3f4f6;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e;
      display: inline-block;
    }
    .dot.off { background: #6b7280; }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .switch {
      position: relative; width: 40px; height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0;
      background: #374151; border-radius: 22px; transition: .2s;
    }
    .slider:before {
      content: ""; position: absolute; height: 16px; width: 16px;
      left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: .2s;
    }
    input:checked + .slider { background: #22c55e; }
    input:checked + .slider:before { transform: translateX(18px); }
    .stat {
      background: #1f2937; border-radius: 8px; padding: 10px 12px;
      font-size: 13px; margin-bottom: 8px;
    }
    .stat b { font-size: 18px; display: block; }
    button {
      width: 100%; padding: 8px; border: none; border-radius: 8px;
      background: #2563eb; color: white; font-size: 13px; cursor: pointer;
      margin-top: 4px;
    }
    button:hover { background: #1d4ed8; }
    .muted { color: #9ca3af; font-size: 11px; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1><span class="dot" id="statusDot"></span> Activity Monitor</h1>

  <div class="row">
    <span>Monitoring</span>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="stat">
    Events logged this session
    <b id="eventCount">0</b>
  </div>

  <button id="screenshotBtn">Capture screenshot now</button>

  <div class="muted">
    Logs page visits, active time, clicks, and scroll depth to your local backend.
    Input field values are never captured.
  </div>

  <script src="popup.js"></script>
</body>
</html>
